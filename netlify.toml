# Static site: no build step. Netlify just publishes the "public" folder.
[build]
  publish = "public"

# Never let a phone or CDN serve a stale copy: always revalidate.
# (Files are tiny and Netlify answers revalidation with a cheap 304.)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
